[package]
name = "relay-harbor"
version = "0.1.0"
description = "RelayHarbor — AI 辅助开发工件管理（Agent 经 MCP 写入 + UI 只读 + Markdown 导出）"
edition = "2021"
# P6 起双可执行：主应用 + mcp-bridge（src/bin/）。裸 `cargo run` 起主应用；
# 桥需显式 `cargo run --bin relay-harbor-bridge`（或直接跑 target 下的 exe）。
default-run = "relay-harbor"

# 分层边界（ADR-001/008）由 scripts/check-rust-boundaries.mjs 在 CI 强制：
#   domain 禁 tauri/sqlx/axum；services 禁 tauri/sqlx/axum；
#   infra → domain；interfaces → services/infra/domain；state.rs 组合根。
# sqlx/axum/tokio 等随对应实现任务引入，本脚手架不预置未用依赖（零投机）。

# 仅桌面（CON-005 Windows 优先、无移动端计划）：rlib 足够；
# 官方模板的 staticlib/cdylib 为移动端预留，且在 Windows 上导致测试 exe 链接失败。
[lib]
name = "relay_harbor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# domain 层基础依赖（ADR-001：禁 tauri/sqlx/axum，以下均不涉框架）
async-trait = "0.1"   # Storage 端口对象安全（组合根 Arc<dyn Storage> 注入双入口）
chrono = { version = "0.4", features = ["serde"] } # UTC 时间戳（修订/文档 changed_at，秒精度格式化归 snapshot）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri = { version = "2", features = ["tray-icon"] } # FR-015 托盘常驻
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript", "derive"] }
uuid = { version = "1", features = ["v4", "serde"] } # 内部主键（DOM-001/002，DB UUID 列）
tauri-plugin-single-instance = "2" # FR-015 单实例（二次启动唤起已有窗口）

# infra 层（CMP-006/007，随 P2 引入）：SQLite 存储 + 运行时 + 结构化日志
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-appender = "0.2"          # NFR-007：~/.relayharbor/logs 按日轮转
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] } # 导出 zip 形态（UI-导出契约 form=zip；入口固定时间戳保证字节确定性）

# interfaces/http 层（CMP-003，随 P5(2/2) 引入）：本地 MCP API
rmcp = { version = "3.2", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] } # client+streamable-http-client：mcp-bridge 上游（P6） # 官方 MCP Rust SDK（选型留痕 2026-09-05：crates.io 3.2.0，Streamable HTTP + 工具宏）
axum = "0.8"                      # 与 rmcp streamable-http-server 同栈（Router/serve/middleware）
schemars = "1"                    # MCP 工具参数 JSON Schema（INT-002：协议层从 Rust 类型导出）

[dev-dependencies]
tempfile = "3"                    # 存储集成测试的临时库文件
tower = { version = "0.5", features = ["util"] } # axum oneshot 测试鉴权中间件

[profile.release]
codegen-units = 1
lto = true
strip = true
